[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-autotrader-bot"
version = "5.1.0"
description = "VPS runtime for the Stock Autotrader engine (PR #4). No broker, no live trading."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
"bot" = ["data/.gitkeep"]
