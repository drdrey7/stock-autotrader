[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-autotrader-engine"
version = "5.1.0"
description = "Private deterministic research, backtest and shadow portfolio engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<2.3",
  "pandas>=2.2,<2.3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
stock-engine = "bot.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["bot", "ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bot", "ai"]
ignore_missing_imports = true
