[extend]
useDefault = true

# Narrow, documented false-positive exceptions.
# Gitleaks v8.30.0 excludes an entire file if a path allowlist matches. To
# ensure a future real credential in the same file is still detected, these
# exceptions are scoped by regex ONLY — matching exact placeholder values —
# not by path. Any other secret in any file is still caught.
[allowlist]
description = "Known false-positive placeholder values in local config templates and billing test fixtures"
regexes = [
  # apps/web/.dev.vars.example BETTER_AUTH_SECRET placeholder (commit d3ba470c)
  '''^replace-with-32-char-secret$''',
  # Billing idempotency-key UUID fixture in worker tests (all-zero example UUID)
  '''^123e4567-e89b-42d3-a456-426614174000$''',
]