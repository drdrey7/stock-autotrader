name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Enforce coverage thresholds
        working-directory: apps/web
        run: npm run test:coverage -- --coverage.reporter=text-summary
      - run: npm run build
      - name: Test deferred review policy
        run: node .github/scripts/test-deferred-review-workflow.mjs
      - name: Validate production Worker dry-run and cron budget
        working-directory: apps/web
        run: |
          node -e 'const fs=require("node:fs"); const config=JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")); const expected=["*/15 * * * *", "0 6 * * *"]; const actual=config.triggers?.crons ?? []; if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Expected exactly two production cron triggers, got ${JSON.stringify(actual)}`); console.log(`Production cron triggers (${actual.length}): ${actual.join(", ")}`);'
          npx wrangler deploy --dry-run
      - name: Validate preview Worker config and dry-run
        working-directory: apps/web
        run: |
          node -e 'const fs=require("node:fs"); const config=JSON.parse(fs.readFileSync("wrangler.preview.jsonc", "utf8")); if (config.name !== "stock-autotrader-preview") throw new Error(`Unexpected preview Worker name: ${config.name}`); if (config.main !== "preview-worker.ts") throw new Error(`Unexpected preview entrypoint: ${config.main}`); if ((config.triggers?.crons ?? []).length !== 0) throw new Error("Preview Worker must have zero cron triggers"); const d1=config.d1_databases ?? []; if (JSON.stringify(d1.map(({binding,database_name}) => ({binding,database_name}))) !== JSON.stringify([{binding:"DB",database_name:"stock-autotrader-preview-db"}])) throw new Error(`Preview must use only the dedicated preview D1: ${JSON.stringify(d1)}`); if (d1[0]?.database_id === "b5a7f345-f5ec-4200-ab41-0a37a01560f2") throw new Error("Preview must not bind production D1"); for (const key of ["kv_namespaces","r2_buckets","durable_objects","queues","secrets"]) if (Object.hasOwn(config,key)) throw new Error(`Preview config must not contain ${key}`); if (config.compatibility_flags?.includes("global_fetch_strictly_public")) throw new Error("Preview Worker must not use public global fetch"); const services=config.services ?? []; if (JSON.stringify(services) !== JSON.stringify([{binding:"PRODUCTION_API",service:"stock-autotrader-web"}])) throw new Error(`Preview must have exactly one production service binding: ${JSON.stringify(services)}`); const vars=Object.keys(config.vars ?? {}).sort(); if (vars.join(",") !== "ENVIRONMENT") throw new Error(`Unexpected preview vars: ${vars.join(",")}`); if (config.vars.ENVIRONMENT !== "preview") throw new Error("Preview ENVIRONMENT must be preview"); const workerFirst=config.assets?.run_worker_first ?? []; if (JSON.stringify(workerFirst) !== JSON.stringify(["/api","/api/*","/__preview/diagnostics"])) throw new Error(`Worker-first routes changed: ${JSON.stringify(workerFirst)}`); const serialized=JSON.stringify(config); if (/PUBLIC_API_ORIGIN|INGEST_SECRET|FINNHUB_API_KEY|FMP_API_KEY|SEC_USER_AGENT|broker/i.test(serialized)) throw new Error("Preview config contains a public-origin or production secret name"); console.log("Preview config uses only the dedicated D1, zero triggers, one production service binding and no secrets");'
          npx wrangler deploy --config wrangler.preview.jsonc --dry-run
      - name: Validate D1 migrations (local)
        working-directory: apps/web
        run: npx wrangler d1 migrations apply stock-autotrader-db --local
      - name: Validate seed against local D1
        working-directory: apps/web
        run: node scripts/verify-local-seed.mjs --local --expect-clean
      - name: Validate Stock Detail against local D1
        working-directory: apps/web
        run: node scripts/verify-stock-detail-local.mjs

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Python (ruff)
        run: |
          pip install --quiet "ruff==0.16.0"
          ruff check .

  history-ingestor:
    name: history-ingestor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test history ingestor without provider calls
        working-directory: apps/history-ingestor
        run: python3 -m unittest discover -s tests -v

  python-services:
    name: python-services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test fundamentals ingestor
        working-directory: apps/fundamentals-ingestor
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Test VPS runtime
        working-directory: bot
        run: |
          pip install --quiet -e .
          python3 -m unittest discover -s tests -v
      - name: Test quote ingestor
        working-directory: apps/quote-ingestor
        run: |
          pip install --quiet "websocket-client>=1.6,<2"
          python3 -m unittest discover -s tests -v

  ai-analysis-runner:
    name: ai-analysis-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint runner
        run: |
          python3 -m pip install --quiet "ruff==0.16.0"
          ruff check apps/ai-analysis-runner
      - name: Syntax-check installer and run rollback harness
        run: |
          bash -n apps/ai-analysis-runner/deploy/install-ai-analysis-runner-root.sh
          bash apps/ai-analysis-runner/tests/test_installer_rollback.sh
      - name: Test runner without paid calls
        working-directory: apps/ai-analysis-runner
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: Install immutable runner dependency lock
        run: |
          python3 -m venv "${RUNNER_TEMP}/ai-analysis-venv"
          "${RUNNER_TEMP}/ai-analysis-venv/bin/python" -m pip install --disable-pip-version-check --requirement apps/ai-analysis-runner/requirements-lock.txt
          "${RUNNER_TEMP}/ai-analysis-venv/bin/python" -m pip check
      - name: Import pinned engine and instantiate Google graph offline
        env:
          GOOGLE_API_KEY: ci-placeholder-never-sent
          RUNNER_VENV: ${{ runner.temp }}/ai-analysis-venv
        run: |
          PYTHONPATH=apps/ai-analysis-runner "$RUNNER_VENV/bin/python" - <<'PY'
          import copy
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          import ai_analysis_runner
          from tradingagents.default_config import DEFAULT_CONFIG
          from tradingagents.graph.trading_graph import TradingAgentsGraph

          assert version("tradingagents") == "0.3.1"
          assert ai_analysis_runner.ENGINE_COMMIT == "01477f9afb7a47b849ed4c9259d3a9a4738d9fda"
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              config = copy.deepcopy(DEFAULT_CONFIG)
              config.update({
                  "llm_provider": "google",
                  "quick_think_llm": "gemini-3.1-flash-lite",
                  "deep_think_llm": "gemini-3.5-flash",
                  "data_cache_dir": str(root / "cache"),
                  "results_dir": str(root / "results"),
                  "memory_log_path": str(root / "memory" / "trading_memory.md"),
                  "checkpoint_enabled": True,
              })
              graph = TradingAgentsGraph(
                  selected_analysts=("market", "social", "news", "fundamentals"),
                  config=config,
              )
              assert graph.selected_analysts == ("market", "social", "news", "fundamentals")
          PY
      - name: Verify hardened systemd service
        run: |
          id hermes >/dev/null 2>&1 || sudo useradd --system --no-create-home hermes
          sudo install -d /opt/stock-autotrader/apps /opt/stock-autotrader-ai-analysis/bin /etc/stock-autotrader
          sudo ln -s "$GITHUB_WORKSPACE/apps/ai-analysis-runner" /opt/stock-autotrader/apps/ai-analysis-runner
          sudo ln -s "${RUNNER_TEMP}/ai-analysis-venv/bin/python" /opt/stock-autotrader-ai-analysis/bin/python
          sudo touch /etc/stock-autotrader/cloudflare.env /etc/stock-autotrader/ai-analysis.env
          sudo systemd-analyze verify apps/ai-analysis-runner/deploy/ai-analysis-runner.service
