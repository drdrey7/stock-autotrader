name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test deferred review policy
        run: node .github/scripts/test-deferred-review-workflow.mjs
      - name: Validate production Worker dry-run and cron budget
        working-directory: apps/web
        run: |
          node -e 'const fs=require("node:fs"); const config=JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")); const expected=["*/15 * * * *", "0 6 * * *"]; const actual=config.triggers?.crons ?? []; if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Expected exactly two production cron triggers, got ${JSON.stringify(actual)}`); console.log(`Production cron triggers (${actual.length}): ${actual.join(", ")}`);'
          npx --yes wrangler@4.122.0 deploy --dry-run
      - name: Validate D1 migrations (local)
        working-directory: apps/web
        run: npx --yes wrangler@4.122.0 d1 migrations apply stock-autotrader-db --local
      - name: Validate seed against local D1
        working-directory: apps/web
        run: node scripts/seed.mjs --local
      - name: Test publisher client (Python)
        run: npm run test -w @stock-autotrader/publisher
      - name: Test VPS runtime (bot, PR #4)
        working-directory: bot
        run: |
          pip install --quiet -e .
          python3 -m unittest discover -s tests -v
