name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate D1 migrations (local)
        working-directory: apps/web
        run: npx --yes wrangler@4 d1 migrations apply stock-autotrader-db --local
      - name: Validate seed against local D1
        working-directory: apps/web
        run: node scripts/seed.mjs --local
