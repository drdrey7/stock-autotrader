name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview (feature branches)
        if: github.ref != 'refs/heads/main'
        id: preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="$(bash "${GITHUB_WORKSPACE}/.github/scripts/preview-worker-name.sh" "${GITHUB_REF_NAME}")"
          npx --yes wrangler@4 deploy --name "${WORKER}"
          echo "url=https://${WORKER}.barroso-labs.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}&state=open" --jq '.[0].number' 2>/dev/null || echo '')"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Preview live"))) | .id][0]' 2>/dev/null || echo '')"
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -f body="🚀 **Preview live**: ${PREVIEW_URL}" > /dev/null
            else
              gh pr comment "$PR_NUMBER" --body "🚀 **Preview live**: ${PREVIEW_URL}" > /dev/null
            fi
          fi
      - name: Deploy production (main only)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
