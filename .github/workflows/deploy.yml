name: Deploy

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (API mode — reads from D1 via the public API)
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
      - name: Deploy production (main only)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          npx --yes wrangler@4 deploy
          echo "$INGEST_SECRET" | npx --yes wrangler@4 secret put INGEST_SECRET
          if [ -n "$FMP_API_KEY" ]; then echo "$FMP_API_KEY" | npx --yes wrangler@4 secret put FMP_API_KEY; fi
