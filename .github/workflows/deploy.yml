name: Deploy

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and build (PR validation only; no preview deployment)
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
      - name: Run lint, typecheck and tests
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Apply remote D1 migrations (production only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify Earnings Engine D1 tables (production only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: npx --yes wrangler@4.122.0 d1 execute stock-autotrader-db --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('earnings_events', 'earnings_universe') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          npx --yes wrangler@4.122.0 deploy
          printf '%s' "$INGEST_SECRET" | npx --yes wrangler@4.122.0 secret put INGEST_SECRET
          if [ -n "$FINNHUB_API_KEY" ]; then
            printf '%s' "$FINNHUB_API_KEY" | npx --yes wrangler@4.122.0 secret put FINNHUB_API_KEY
          fi
          if [ -n "$SEC_USER_AGENT" ]; then
            printf '%s' "$SEC_USER_AGENT" | npx --yes wrangler@4.122.0 secret put SEC_USER_AGENT
          fi
