name: Deploy

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate and build
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_AI_WEB_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}-ai-web-preview.barroso-labs.workers.dev', github.event.pull_request.number) || '' }}
      - name: Run lint, typecheck and tests
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Upload PR frontend artifact for trusted preview publisher
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-preview-pr-${{ github.event.pull_request.number }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
      - name: Upload AI Web PR frontend artifact for trusted preview publisher
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-web-preview-pr-${{ github.event.pull_request.number }}
          path: apps/ai-web/dist
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: false
      - name: Apply remote D1 migrations (production only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify Earnings Engine D1 tables (production only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: npx --yes wrangler@4.123.0 d1 execute stock-autotrader-db --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('earnings_events', 'earnings_universe') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
        run: |
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::BETTER_AUTH_SECRET repository secret is required for production deploys"
            exit 1
          fi
          if [ -z "$BETTER_AUTH_API_KEY" ]; then
            echo "::error::BETTER_AUTH_API_KEY repository secret is required for production deploys"
            exit 1
          fi
          npx --yes wrangler@4.123.0 deploy
          printf '%s' "$INGEST_SECRET" | npx --yes wrangler@4.123.0 secret put INGEST_SECRET
          printf '%s' "$BETTER_AUTH_SECRET" | npx --yes wrangler@4.123.0 secret put BETTER_AUTH_SECRET
          printf '%s' "$BETTER_AUTH_API_KEY" | npx --yes wrangler@4.123.0 secret put BETTER_AUTH_API_KEY
          if [ -n "$FINNHUB_API_KEY" ]; then
            printf '%s' "$FINNHUB_API_KEY" | npx --yes wrangler@4.123.0 secret put FINNHUB_API_KEY
          fi
          if [ -n "$SEC_USER_AGENT" ]; then
            printf '%s' "$SEC_USER_AGENT" | npx --yes wrangler@4.123.0 secret put SEC_USER_AGENT
          fi
      - name: Bootstrap and verify production Core/Earnings (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: npm run db:bootstrap:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_WORKER_URL: https://stock-autotrader-web.barroso-labs.workers.dev
      - name: Deploy AI Web production (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/ai-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config wrangler.production.jsonc
