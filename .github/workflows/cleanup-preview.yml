name: Cleanup Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preview cleanup skipped for fork PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "preview cleanup skipped for fork PR"
      - name: Delete preview Worker for merged/closed PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WORKER="stock-autotrader-preview-pr-${PR_NUMBER}"
          echo "Deleting preview Worker: ${WORKER}"
          if [[ "${WORKER}" == "stock-autotrader-web" ]] || [[ "${WORKER}" != "stock-autotrader-preview-"* ]]; then
            echo "Refusing to delete non-preview Worker" >&2
            exit 1
          fi
          RESPONSE="$(curl -sS -w '\n%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"
          echo "Delete ${WORKER}: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "404" ]; then
            exit 0
          fi
          if [ "${HTTP_CODE}" != "200" ] || ! printf '%s' "${BODY}" | jq -e '.success == true' > /dev/null; then
            echo "Unexpected status deleting preview Worker" >&2
            exit 1
          fi
