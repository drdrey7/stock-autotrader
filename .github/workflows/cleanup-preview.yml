name: Cleanup Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Delete preview Worker for merged/closed PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          BRANCH_SLUG="$(printf '%s' "${PREVIEW_BRANCH}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')"
          if (( ${#BRANCH_SLUG} > 29 )); then
            BRANCH_HASH="$(printf '%s' "${PREVIEW_BRANCH}" | sha256sum | cut -c1-6)"
            BRANCH_SLUG="${BRANCH_SLUG:0:22}"
            BRANCH_SLUG="${BRANCH_SLUG%-}-${BRANCH_HASH}"
          fi
          WORKER="stock-autotrader-preview-${BRANCH_SLUG}"
          echo "Deleting preview Worker: ${WORKER}"
          if [[ "${WORKER}" == "stock-autotrader-web" ]] || [[ "${WORKER}" != "stock-autotrader-preview-"* ]]; then
            echo "Refusing to delete non-preview Worker" >&2
            exit 1
          fi
          RESPONSE="$(curl -sS -w '\n%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"
          echo "Delete ${WORKER}: HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "404" ]; then
            exit 0
          fi
          if [ "${HTTP_CODE}" != "200" ] || ! printf '%s' "${BODY}" | jq -e '.success == true' > /dev/null; then
            echo "Unexpected status deleting preview Worker" >&2
            exit 1
          fi
