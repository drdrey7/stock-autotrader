name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check command authorization and target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          REVIEW_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          allowed=false
          reason=permission_lookup_failed

          # author_association is not an authorization boundary: MEMBER and
          # COLLABORATOR can still have read/triage-only access. Fail closed
          # unless GitHub positively reports effective write-capable access.
          if permission=$(gh api "repos/$REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission' 2>/dev/null) && [[ -n "$permission" ]]; then
            case "$permission" in
              admin|maintain|write)
                allowed=true
                reason=allowed
                ;;
              *)
                allowed=false
                reason=insufficient_permission
                ;;
            esac
          fi

          # Only inspect the PR target after the commenter has passed the
          # effective-permission check. PR commands fail closed unless the
          # head repository is positively verified as this repository.
          if [[ "$allowed" == "true" && "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            allowed=false
            reason=target_lookup_failed
            if [[ -n "$REVIEW_HEAD_REPO" ]]; then
              if [[ "$REVIEW_HEAD_REPO" == "$REPOSITORY" ]]; then
                allowed=true
                reason=allowed
              else
                reason=fork_pull_request
              fi
            fi
          elif [[ "$allowed" == "true" && "$EVENT_NAME" == "issue_comment" && "$ISSUE_IS_PR" == "true" ]]; then
            allowed=false
            reason=target_lookup_failed
            if head_repo=$(gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER" --jq '.head.repo.full_name' 2>/dev/null) && [[ -n "$head_repo" ]]; then
              if [[ "$head_repo" == "$REPOSITORY" ]]; then
                allowed=true
                reason=allowed
              else
                reason=fork_pull_request
              fi
            fi
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Explain blocked command
        if: steps.target.outputs.allowed != 'true'
        shell: bash
        run: |
          case "${{ steps.target.outputs.reason }}" in
            insufficient_permission)
              echo "OpenCode command blocked: commenter does not have write, maintain, or admin permission on this repository."
              ;;
            permission_lookup_failed)
              echo "OpenCode command blocked because the commenter's effective repository permission could not be verified."
              ;;
            fork_pull_request)
              echo "OpenCode write-capable commands are disabled for fork pull requests because repository secrets are not exposed to fork workflows."
              ;;
            *)
              echo "OpenCode command blocked because the pull-request target could not be verified as belonging to this repository."
              ;;
          esac

      - name: Checkout repository
        if: steps.target.outputs.allowed == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run OpenCode command
        if: steps.target.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
